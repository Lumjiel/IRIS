name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-timeout
        env:
          PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
      - name: Run tests
        run: python -m pytest tests/ -q
        env:
          OPENAI_API_KEY: ci-dummy-key
          OPENAI_API_BASE: https://dashscope.aliyuncs.com/compatible-mode/v1
          DASHSCOPE_API_KEY: ci-dummy-key
          TAVILY_API_KEY: ci-dummy-key
          HITHINK_FINANCE_API_KEY: ci-dummy-key

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
